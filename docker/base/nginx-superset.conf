# aio-superset — nginx: TLS terminator + reverse proxy to gunicorn (127.0.0.1:8088).
# 80 redirects to 443. Cert/key come from /opt/superset/tls (self-signed on
# first boot, or mount your own). Superset's own API is same-origin at /api/*.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /opt/superset/tls/tls.crt;
    ssl_certificate_key /opt/superset/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Superset uploads / large query payloads.
    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (async queries / live features).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
