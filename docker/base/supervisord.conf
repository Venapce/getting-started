; venapce-base — process supervision.
;
; Start order is by priority. postgres (only when internal) comes up first, the
; one-shot bootstrap migrates the metadata DB and creates the admin user, and
; gunicorn / nginx wait on the bootstrap gate (run-gate.sh) before serving. There
; is no Redis and no Celery — Superset runs as a synchronous BI engine (the async
; features that would need a broker are off). All logs go to the container stdout.

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

; Images built FROM venapce-base drop extra programs here (e.g. the venapce-api
; program in the venapce image) without rewriting this file. This is what makes
; the base a reusable, permanent layer: superset + postgres + nginx live here,
; the product processes are added on top.
[include]
files = /etc/supervisor/conf.d/*.conf

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Internal Postgres — autostart is toggled off by the entrypoint when an
; external (shared) Postgres is configured.
[program:postgres]
command=/opt/superset/run-postgres.sh
user=postgres
priority=100
autostart=%(ENV_PG_AUTOSTART)s
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:bootstrap]
command=/opt/superset/bootstrap.sh
user=root
priority=200
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:superset]
command=/opt/superset/run-gate.sh gunicorn --bind 0.0.0.0:8088 --workers %(ENV_GUNICORN_WORKERS)s --worker-class gthread --threads 4 --timeout 120 --limit-request-line 0 --limit-request-field_size 0 "superset.app:create_app()"
directory=/app
user=superset
priority=300
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
priority=400
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
