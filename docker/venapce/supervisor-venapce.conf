; venapce — product processes added on top of venapce-base.
;
; Dropped into /etc/supervisor/conf.d/, which base/supervisord.conf includes, so
; the base's programs (postgres, superset bootstrap, gunicorn, nginx) run
; unchanged and these start alongside them by priority:
;
;   100  postgres                    (base)
;   150  venapce-db   one-shot       -> create the `venapce` role + database
;   200  bootstrap    one-shot       (base: superset metadata + admin user)
;   300  gunicorn                    (base)
;   350  venapce-api                 -> waits for the DB + superset gate, then serves
;   400  nginx                       (base image config replaced with the panel)

; One-shot: ensure the venapce role + database exist in the internal Postgres
; before the API (which then migrates its own schema) starts. Runs as root so it
; can `su postgres`. Skipped automatically when an external Postgres is used.
[program:venapce-db]
command=/opt/venapce/venapce-db.sh
user=root
priority=150
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:venapce-api]
command=/opt/venapce/run-venapce.sh
user=root
priority=350
autostart=true
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
