# venapce — nginx panel front door (single origin on :80).
#
# This REPLACES the base image's superset-only nginx config. Everything the
# browser needs is same-origin here, so the compiled Vue panel is built with
# VITE_VENAPCE_API_URL=/ and there is no CORS and no baked-in backend host:
#
#   /            -> the Vue panel (static SPA, client-side routed)
#   /api/        -> the venapce-api Go backend on 127.0.0.1:8091
#   /healthz     -> the backend's liveness probe
#
# Superset itself is NOT proxied here — the backend reaches it in-container on
# 127.0.0.1:8088 and fronts its data endpoints under /api/superset/*. Superset's
# own admin UI is published directly on the container's 8088 for operators.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Chart payloads / dataset uploads proxied through the backend can be large.
    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── the Go backend ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8091;
        access_log off;
    }

    # ── the Vue panel (SPA) ───────────────────────────────────────────────────
    root /srv/venapce-www;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
